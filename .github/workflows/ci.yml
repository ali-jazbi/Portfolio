name: Portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          PLAYWRIGHT_PRODUCTION: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-checks
          path: |
            playwright-report/
            artifacts/screenshots/
